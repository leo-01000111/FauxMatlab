name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 needs these even to run offscreen: the platform plugin links
      # against them, so the import fails outright without them rather than
      # degrading to a headless mode.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - run: pip install -e ".[dev]"

      # `tests/conftest.py` pins the Qt binding and the offscreen platform, so
      # the UI tests build real widgets with no display attached.
      - name: pytest
        run: pytest -q

      # The same self-test a packaged build ships with. It runs every course
      # lesson's analytic claims, so a CI pass means the numbers agree with
      # the theory, not merely that nothing raised.
      - name: self-test
        run: python app.py --check

  build:
    name: PyInstaller (windows)
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/fauxmatlab.spec

      # A build that cannot pass its own self-test is not a release. Run the
      # console entry point, not the windowed one: a windowed executable on
      # Windows has no stdout, so a failure would set the exit code and leave
      # the CI log with nothing in it.
      - name: self-test the frozen build
        run: dist/FauxMatlab/FauxMatlab-check.exe --check

      - uses: actions/upload-artifact@v4
        with:
          name: FauxMatlab-windows
          path: dist/FauxMatlab
          retention-days: 14
