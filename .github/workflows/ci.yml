name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.9.0) builds the exe and publishes it as a release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 needs these even to run offscreen: the platform plugin links
      # against them, so the import fails outright without them rather than
      # degrading to a headless mode.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - run: pip install -e ".[dev]"

      # `tests/conftest.py` pins the Qt binding and the offscreen platform, so
      # the UI tests build real widgets with no display attached.
      # A hung test (a modal dialog, a nested event loop nobody quits) used
      # to hold both runners for the six-hour job limit. The faulthandler
      # dumps every thread's stack after 5 min on one test, which names it;
      # the step timeout then ends the job instead of waiting out the limit.
      - name: pytest
        timeout-minutes: 30
        run: pytest -q -o faulthandler_timeout=300

      # The same self-test a packaged build ships with. It runs every course
      # lesson's analytic claims, so a CI pass means the numbers agree with
      # the theory, not merely that nothing raised.
      - name: self-test
        run: python app.py --check

  build:
    name: PyInstaller (windows)
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # Creating the release on a tag needs write access to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/evans.spec

      # A build that cannot pass its own self-test is not a release.
      #
      # BOTH entry points, and that is the point. The console build is the one
      # with a readable report. The windowed build is the one people actually
      # double-click, and it differs in a way that matters: it has no standard
      # streams, so packages that capture `sys.stderr.write` at import time
      # fail there and nowhere else. Testing only the console exe is how a
      # launch-blocking crash shipped once already.
      - name: self-test the frozen build (console, readable report)
        run: dist/Evans/Evans-check.exe --check

      - name: self-test the frozen build (windowed, exit code only)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Evans/Evans.exe `
                             -ArgumentList '--check' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "windowed build failed its self-test (exit $($p.ExitCode))"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Evans-windows
          path: dist/Evans
          retention-days: 14

      # The installer wraps the same folder that just passed its self-test.
      # The runner image usually ships Inno Setup; install it if not. The
      # script reads the version from src/evans/__init__.py itself.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          & $iscc packaging/evans.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          $setup = Get-ChildItem dist/Evans-Setup-*.exe | Select-Object -First 1
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Evans-Setup
          path: dist/Evans-Setup-*.exe
          retention-days: 14

      - name: Zip the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/Evans -DestinationPath Evans-windows.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "$env:SETUP" Evans-windows.zip
          --title "Evans ${{ github.ref_name }}" --generate-notes
